spring.application.name=relay
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/relay
spring.datasource.username=relay
spring.datasource.password=relay
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

relay.streams.delivery-stream-key=relay:deliveries
relay.streams.consumer-group=relay-workers

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
