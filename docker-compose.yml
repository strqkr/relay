services:
  postgres:
    image: postgres:16
    container_name: relay-postgres
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "5432:5432"
    volumes:
      - relay_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: relay-redis
    ports:
      - "6379:6379"

volumes:
  relay_pgdata:
